# 示例 brief · 六页（覆盖五种证据形状与一次「相加 100%」陷阱）
meta:
  title: 澄海净水 2026 渠道复盘
  author: 设计总监
  date: 2026-10
  lang: zh
audience: 管理层与渠道负责人，现场复盘会 + 会后异步阅读
decision: 批准 Q1 把预算从直营门店转投到经销渠道
tension: 门店数量在涨、单店产出在跌，团队对「加店还是换渠道」还没有共识
source: 澄海净水内部经营看板
unit: 万元
period: 2026 Q1–Q3
basis: 已开票收入，不含退货

slides:
  - id: s01
    title: 加店不再带来增长
    content: |-
      门店数量增长 18%，单店月均产出下降 21%。
      增长来源已经从「铺店」转向「单店效率」。
    source: 澄海净水内部经营看板
    asset:
      path: assets/warehouse.jpg
      function: hero
      reason: 让观众看见渠道现场的真实密度：货架与在库量是「铺店已到位」的直接证据，拿掉它，这一页只剩结论没有现场
      fit: cover
      safe_area: {x: 0.0, y: 0.10, width: 0.52, height: 0.80}
      text_color: dark
  - id: s02
    title: 门店在增，产出在跌
    content: |-
      门店数量 128 家
      单店月均产出降幅 21%
      门店数量增幅 18%
      同店口径，同比。
    source: 澄海净水内部经营看板
  - id: s03
    title: 经销渠道的单店产出高出直营门店 2.4 倍
    content: |-
      4.6
      经销渠道单店月均产出
      万元
      1.9
      直营门店单店月均产出
      万元
    source: 渠道月度结算表
    unit: 万元
  - id: s04
    title: 经销渠道收入占比逐季抬升
    content: |-
      2026 Q1 到 Q3，经销渠道收入占比从 34% 升到 51%。
    source: 渠道月度结算表
    chart:
      kind: column
      categories: ["2026 Q1", "2026 Q2", "2026 Q3"]
      series:
        - name: 经销渠道收入占比
          values: [34, 43, 51]
      takeaway: 三个季度连续抬升，不是单季波动。
  - id: s05
    title: 渠道结构
    content: |-
      经销
      占 51%
      直营门店
      占 34%
      电商
      占 15%
      三项相加为 100%，但一个客户可以同时在三个渠道下单。
    source: 渠道月度结算表
  - id: s06
    title: 请批准 Q1 预算从直营门店转投经销渠道
    content: |-
      直营门店的边际产出已经低于经销渠道。
      把 Q1 新增预算的 70% 转向经销渠道，用同样的钱换更高的单店产出。
      决定：批准 Q1 渠道预算调整方案。
    source: 澄海净水财务部
