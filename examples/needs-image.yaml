# 需要生产一张图的最小 brief（示例）。
#
# 与 examples/demo.yaml 的区别：这张图**还不存在**。`compose` 会照常写出图位并标
# `_missing`、附上生产说明；`guard` 报 ASSET_MISSING 拦住交付；`pvad.py media`
# 把提示词、比例、目标像素导出来交给摄影师或图像模型。图到位后重跑 build 即闭环。
#
# 复现：
#   make briefs        # plan → build → media，输出 examples/output/needs-image/
#   python scripts/pvad.py check examples/output/needs-image/deck.json /tmp/x.pptx --mode release
#   → BLOCK / ASSET_MISSING（这是正确行为：没有图就不能宣称完成）

audience: 区域运营负责人
decision: 决定是否在华东再加 3 个前置仓
tension: 团队在「加店」和「提效」之间没有共识
source: 内部经营看板
unit: 万元
period: 2026 Q1–Q3
basis: 已开票收入

slides:
  - id: s01
    title: 加仓不再带来增长
    content: |-
      网点数量增长 18%，单点月均产出下降 21%。
    source: 内部经营看板
    asset:
      path: assets/east_china_dark_store.jpg
      function: hero
      fit: cover
      # 画面里出现什么——没有这一句，提示词就无法回答「拍什么」
      subject: 华东前置仓分拣线，两名拣货员在货架通道间补货，纸箱堆到视线高度
      # 拿掉这张图会损失什么——说不出理由的图就是装饰
      reason: 让观众看见网点密度背后的现场拥挤，而不是用一个百分比代替现场
      safe_area: [0.0, 0.08, 0.46, 0.84]
      text_color: dark
      avoid: [brand logos, identifiable faces]

  - id: s02
    title: 单点产出下降集中在直营网点
    content: |-
      3.4
      直营网点单点月均产出
      万元
      4.6
      经销网点单点月均产出
      万元
    source: 渠道月度结算表
    unit: 万元
