name: ci

# 只证明工程链可运行：Python 契约、Schema、单元/集成、评估回归、CLI 与干净打包。
# 目标 PowerPoint、整稿人工复核和素材合规 require external evidence，
# 不在 CI 里推断，也不把 CI 绿当作可发布。
on:
  push:
  pull_request:

jobs:
  engineering:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q scripts evals tests

      - name: Validate schemas
        run: |
          python - <<'PY'
          import json, pathlib
          from jsonschema import Draft202012Validator
          for path in sorted(pathlib.Path("schema").glob("*.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
          print("schemas ok")
          PY

      - name: Unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Judgment benchmark and lexicon ablation
        run: python evals/judgment_eval.py --ablate --baseline

      - name: Typography comparison
        run: python evals/typography_eval.py

      - name: Prompt comparison
        run: python evals/prompt_eval.py

      - name: Clean package smoke
        run: python scripts/package_skill.py --out ci-package --include-tests --zip ci-package.zip

      - name: Record external gates as unverified
        run: |
          echo "External gates (target PowerPoint, whole-deck review, asset compliance) require external evidence."
          echo "This workflow does not open PowerPoint and does not judge visual quality."
