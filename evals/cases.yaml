# 判断评测用例 · 每个用例只声明「协议要求什么」，不声明「哪种写法好看」
#
# 诚实声明（重要）：
#   * 本套用例与本技能包同步编写，不是独立盲标；被看过的用例自此只能算回归集，
#     不能当作泛化能力证明。
#   * 通过率只反映「页面角色 / 证据形状 / 主张来源 / 构图」这几个离散判断，
#     不反映构图美感、断行质量、信息层级是否成立。
#   * 每条用例说明里写清「违反了哪条纪律」，便于失败时定位到协议而非代码。
#
# 字段：expect 里出现的键才比较；claim_contains 用于「派生主张」的内容检查。

deck:
  audience: 管理层与渠道负责人
  decision: 批准 Q1 渠道预算调整
  tension: 门店在增、单店产出在跌
  source: 内部经营看板
  unit: 万元
  period: 2026 Q1–Q3
  basis: 已开票收入

cases:
  - id: J01
    category: claim
    statement: 作者主张压过正文证据行
    protocol: SKILL「设计判断协议」「主张、证据与焦点」：作者写了就用，写不出留空不编
    slide:
      id: s01
      title: 交付周期
      claim: 交付周期必须减半
      content: 交付平均 42 天。
    expect: {claim_source: author, claim_contains: 必须减半}

  - id: J02
    category: claim
    statement: 话题标签不升格为主张（只有分项数字，没有结论句 → absent）
    protocol: SKILL「设计判断协议」「主张、证据与焦点」：话题标签不立主张，记 open question
    slide:
      id: s01
      title: 渠道结构
      content: |-
        经销 51%
        直营 34%
        电商 15%
    expect: {claim_source: absent, question: CLAIM_ABSENT, evidence: part_whole}

  - id: J03
    category: claim
    statement: 正文结论句可竞争主张位
    protocol: SKILL「设计判断协议」「主张、证据与焦点」：正文带主张形状才可竞争
    slide:
      id: s01
      title: 渠道复盘
      content: |-
        上半年投入增加 12%，收入只增加 3%。
        因此继续加店的边际收益已经不成立。
    expect: {claim_source: derived, claim_contains: 边际收益}

  - id: J04
    category: role
    statement: 封面日期/评审名不参与角色判断
    protocol: SKILL「设计判断协议」「不确定性纪律」：元信息不是内容
    slides:
      - id: s01
        title: 发布周期可以再压缩一半
        content: 2026-10-21 内部评审 版本 v2
      - id: s02
        title: 请批准下一步
        content: 决定：批准。
    expect_index0: {role: establish}

  - id: J05
    category: evidence
    statement: 相加为 100% 不证明同一分母
    protocol: SKILL「设计判断协议」「不确定性纪律」
    slide:
      id: s01
      title: 用药结果
      content: |-
        缓解率 60%
        不良反应率 40%
        两项相加为 100%，但同一患者可同时满足。
    expect: {evidence: comparison, denominator_proven: false, composition: metric_row}

  - id: J06
    category: evidence
    statement: 同分母互斥分项可以画占比
    protocol: SKILL「设计判断协议」「主张、证据与焦点」
    slide:
      id: s01
      title: 收入构成
      content: |-
        经销 51%
        直营 34%
        电商 15%
    expect: {evidence: part_whole, composition: part_whole, denominator_proven: true}

  - id: J07
    category: evidence
    statement: 单点同比不是时间序列
    protocol: SKILL「设计判断协议」「逐页判断顺序」：形状由内容形状决定
    slide:
      id: s01
      title: 单店产出同比下滑 21%
      content: 单店月均产出同比下降 21%。
    expect: {evidence_not: series}

  - id: J08
    category: evidence
    statement: 并列职责不是时间线
    protocol: SKILL「设计判断协议」「不确定性纪律」：职责并列 ≠ 上下级 ≠ 顺序
    slide:
      id: s01
      title: 两个组的职责
      content: |-
        青禾组：负责质量测试
        澄海组：负责项目交付
    expect: {evidence_not: sequence, composition_not: sequence_steps}

  - id: J09
    category: evidence
    statement: 有编号的阶段才是顺序
    protocol: SKILL「设计判断协议」「主张、证据与焦点」
    slide:
      id: s01
      title: 上线分三步
      content: |-
        第一步：冻结需求
        第二步：小流量灰度
        第三步：全量发布
    expect: {evidence: sequence, composition: sequence_steps}

  - id: J10
    category: evidence
    statement: 同单位两端才有差值
    protocol: SKILL「设计判断协议」「不确定性纪律」：差值需要同口径
    slide:
      id: s01
      title: 经销渠道单店产出高出直营 2.4 倍
      content: |-
        4.6
        经销渠道单店月均产出
        万元
        1.9
        直营门店单店月均产出
        万元
    expect: {evidence: comparison, delta: true, composition: two_end}

  - id: J11
    category: evidence
    statement: 不同单位并排不能相减
    protocol: SKILL「设计判断协议」「不确定性纪律」
    slide:
      id: s01
      title: 门店与产出
      content: |-
        128
        门店数量
        家
        4.6
        单店月产出
        万元
    expect: {delta: false, composition: metric_row}

  - id: J12
    category: chart
    statement: 作者给出图数据时形状随数据
    protocol: SKILL「设计判断协议」「逐页判断顺序」：图由作者声明决定
    slide:
      id: s01
      title: 占比逐季抬升
      content: Q1 到 Q3 从 34% 升到 51%。
      chart:
        kind: column
        categories: ["2026 Q1", "2026 Q2", "2026 Q3"]
        series:
          - name: 占比
            values: [34, 43, 51]
    expect: {evidence: series, composition: series_chart}

  - id: J13
    category: evidence
    statement: 结构词 + 多条目 → 结构页而不是流程页
    protocol: SKILL「设计判断协议」「不确定性纪律」：结构不明先补证据
    slide:
      id: s01
      title: 组织分为三个模块
      content: |-
        产品模块：负责需求
        交付模块：负责实施
        数据模块：负责口径
    expect: {evidence_not: sequence}

  - id: J14
    category: probe
    statement: 因果措辞只产生待确认问题，不产生箭头
    protocol: SKILL「设计判断协议」「逐页判断顺序」
    slide:
      id: s01
      title: 因此我们应当转向
      content: 门店上升因此产出下降。
    expect: {evidence_not: sequence, question: PROBE_CAUSAL_RISK}

  - id: J15
    category: provenance
    statement: 数字缺来源时追问而不是补编
    protocol: SKILL「证据层级」
    slide:
      id: s01
      title: 收入 4.6 万元
      content: |-
        4.6
        收入
    deck_override: {source: "", period: "", basis: "", unit: ""}
    expect: {question: PROVENANCE_MISSING}

  - id: J16
    category: role
    statement: 末页带请求 → 收束并承接决定
    protocol: SKILL「设计判断协议」「逐页判断顺序」
    slides:
      - id: s01
        title: 门店在增，产出在跌
        content: 门店增长 18%，单店产出下降 21%。
      - id: s02
        title: 请批准 Q1 预算调整
        content: 决定：批准。
    expect_index0: {role: establish}
    expect_index1: {role: summarize, composition: statement}

  - id: J17
    category: evidence
    statement: 无证据的纯观点页不硬凑图表
    protocol: SKILL「五层架构与权威源」「主张、证据与焦点」
    slide:
      id: s01
      title: 加店不再带来增长
      content: 增长来源已经从铺店转向单店效率。
    expect: {evidence: proposition, composition: statement, composition_not: series_chart}

  - id: J18
    category: evidence
    statement: 单位不一致时不造差值轴
    protocol: SKILL「设计判断协议」「不确定性纪律」
    slide:
      id: s01
      title: 收入与门店
      content: |-
        收入 4.6 万元
        门店 128 家
    expect: {delta: false}

  - id: J19
    category: claim
    statement: 只有标题没有证据 → 主张与证据都记未决
    protocol: SKILL「设计判断协议」：判不准就落未断言
    slide:
      id: s01
      title: 2026 年渠道工作概览
      content: ""
    expect: {evidence: none}

  - id: J20
    category: evidence
    statement: 时间读数（≥3 个期间）才是曲线
    protocol: SKILL「设计判断协议」「逐页判断顺序」
    slide:
      id: s01
      title: 收入逐季变化
      content: |-
        2026 Q1 收入 31 万元
        2026 Q2 收入 39 万元
        2026 Q3 收入 46 万元
    expect: {evidence: series}

  - id: J21
    category: probe
    statement: 条件与已发生事实不共用一个形态
    protocol: SKILL「设计判断协议」「不确定性纪律」
    slide:
      id: s01
      title: 如果渠道继续扩张
      content: 如果 Q1 继续扩张，单店产出会回升。
    expect: {question: PROBE_CONDITIONAL}

  - id: J22
    category: evidence
    statement: 相关措辞不被画成因果链
    protocol: SKILL「设计判断协议」「不确定性纪律」
    slide:
      id: s01
      title: 门店与口碑同步上升
      content: 门店数量和好评率同时上升。
    expect: {evidence_not: sequence, question: PROBE_CORRELATION_CUE}

  - id: J23
    category: claim
    statement: 标题含数值变化即论断
    protocol: SKILL「设计判断协议」「主张、证据与焦点」
    slide:
      id: s01
      title: 单店产出下降 21%
      content: 单店月均产出 4.6 万元。
    expect: {claim_source: author, claim_contains: 21%}

  - id: J24
    category: evidence
    statement: 占比声明 + 同单位分项 → 占比页
    protocol: SKILL「设计判断协议」「主张、证据与焦点」
    slide:
      id: s01
      title: 三项业务占比
      content: |-
        会员 40%
        零售 35%
        服务 25%
    expect: {evidence: part_whole}

  - id: J25
    category: evidence
    statement: 有占比声明但分项合计不到 100 时，仍按整体分项处理（不靠数值求和兜底）
    protocol: SKILL「设计判断协议」「主张、证据与焦点」：占比声明来自作者，不只来自算术
    slide:
      id: s01
      title: 会员业务占比
      content: |-
        会员 40%
        零售 35%
        其中会员业务占比最高。
    expect: {evidence: part_whole}

  - id: J26
    category: evidence
    statement: 结构词 + 多条目 → 结构页
    protocol: SKILL「设计判断协议」「不确定性纪律」：结构不明先补证据，不补连线
    slide:
      id: s01
      title: 三模块体系
      content: |-
        产品模块：负责需求
        交付模块：负责实施
        数据模块：负责口径
    expect: {evidence: structure, composition: structure_map}

  - id: J27
    category: role
    statement: 中间页的「请批准」把页面任务变成说服
    protocol: SKILL「设计判断协议」「逐页判断顺序」
    slides:
      - id: s01
        title: 门店在增，产出在跌
        content: 门店增长 18%，单店产出下降 21%。
      - id: s02
        title: 请批准 Q1 预算调整
        content: 决定：批准。
      - id: s03
        title: 下一步
        content: 按季度复盘。
    expect_index1: {role: persuade}

  - id: J28
    category: claim
    statement: 变化措辞本身就是论断（即使没有数字）
    protocol: SKILL「设计判断协议」「主张、证据与焦点」：结论措辞才算主张位
    slide:
      id: s01
      title: 单店产出逐季走高
      content: 渠道结构正在调整，团队仍在观察。
    expect: {claim_source: author, claim_contains: 逐季走高}

  - id: J29
    category: claim
    statement: 行动语气被识别为「要决定」，而不是普通描述
    protocol: SKILL「设计判断协议」「逐页判断顺序」：决定类型决定收束页焦点
    slide:
      id: s01
      title: 应当重新评估渠道预算
      content: 现有口径无法区分渠道贡献。
    expect: {claim_source: author, claim_form: imperative}

  - id: J30
    category: media
    statement: 作者声明素材 → 判断记 required 并采用声明职能
    protocol: SKILL「素材艺术指导与合规」「素材职责」：出图由作者声明决定，职责必须说清
    slide:
      id: s01
      title: 加店不再带来增长
      content: 门店数量增长 18%，单店月均产出下降 21%。
      asset:
        path: assets/not-yet-generated.jpg
        function: hero
        reason: 让观众看见渠道现场的真实密度
    expect: {media_decision: required, media_function: hero, composition: image_narrative}

  - id: J31
    category: media
    statement: 未声明素材 + 出现可视对象 → 只提示，不出图
    protocol: SKILL「素材艺术指导与合规」：词表只提示，未声明不出图（避免自动配图导致的素材堆砌）
    slide:
      id: s01
      title: 车间产能复盘
      content: 车间设备利用率 78%。
    expect: {media_decision: none, media_source_prefix: "rule:visual-subject", question: ASSET_HINT}

  - id: J32
    category: media
    statement: 纯数据页不因词表提示自动配图
    protocol: SKILL「素材艺术指导与合规」「设计判断协议」「不确定性纪律」：数字页的主要视觉是数据形状
    slide:
      id: s01
      title: 经销渠道单店产出高出直营 2.4 倍
      content: |-
        4.6
        经销渠道单店月产出
        万元
        1.9
        直营门店单店月产出
        万元
    expect: {media_decision: none, composition: two_end}

  - id: J33
    category: evidence
    statement: 明确流程词使同单位阶段读数成为顺序，而不是并排比较
    protocol: SKILL「设计判断协议」：流程关系必须来自作者的强顺序措辞；删除 sequence_strong 后本例应翻转
    slide:
      id: s01
      title: 上线流程分为两个阶段
      content: |-
        灰度阶段 10 天
        全量阶段 5 天
    expect: {evidence: sequence, composition: sequence_steps}
