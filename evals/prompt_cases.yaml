# 提示词评测用例：每条的 expect 是「这份生产说明必须能让生产端照着做」的可判定条款。
#
# 为什么不用图像模型打分：本包不调用图像生成（SKILL「素材艺术指导与合规」），也不假装评过图。
# 能判定的只有**说明本身**：说没说清拍什么、为什么、给谁让位、交付多大。
# 出图好不好看属于 L3（人工盲评），这里不宣称。

cases:
  - id: P01
    name: 主视觉 + 左栏压字
    given: {function: hero, role: subject, box: [712, 56, 496, 624],
            safe_area: {x: 0.0, y: 0.08, width: 0.46, height: 0.84}, text_color: dark,
            subject: "华东区前置仓的分拣线，两名拣货员在通道间补货"}
    expect: [subject_stated, duty_stated, role_stated, quiet_area_stated, no_panel_guard,
             tone_stated, no_coordinates, negative_production, ratio_usable, ratio_snapped,
             target_px_floor, no_style_words]
  - id: P02
    name: 右栏压字（安静面在右）
    given: {function: context, role: subject, box: [56, 56, 560, 620],
            safe_area: {x: 0.62, y: 0.1, width: 0.34, height: 0.8}, text_color: light,
            subject: "a regional distribution centre aisle at shift change"}
    expect: [subject_stated, duty_stated, quiet_right, tone_stated, no_coordinates, ratio_usable]
  - id: P03
    name: 背景氛围图不带主体竞争
    given: {function: frame, role: background, box: [0, 0, 1280, 720], text_color: light,
            subject: "warehouse racking dissolving into depth, no people",
            safe_area: {x: 0.06, y: 0.1, width: 0.4, height: 0.8}}
    expect: [subject_stated, role_background, duty_stated, quiet_area_stated, no_coordinates,
             ratio_usable]
  - id: P04
    name: 证据图（proof）不得戏剧化
    given: {function: proof, role: subject, box: [780, 120, 440, 480],
            subject: "the damaged pallet corner as found on the dock",
            safe_area: {x: 0.0, y: 0.1, width: 0.35, height: 0.8}, text_color: dark}
    expect: [subject_stated, proof_plainly, negative_proof, no_coordinates, ratio_usable]
  - id: P05
    name: 无安全区（版面不压字）就不发让位指令
    given: {function: hero, role: subject, box: [0, 0, 640, 640],
            subject: "one pallet stacked with unlabelled cartons"}
    expect: [subject_stated, quiet_absent, no_coordinates, ratio_usable, target_px_floor]
  - id: P06
    name: 作者禁项必须保留
    given: {function: hero, role: subject, box: [56, 56, 500, 600],
            subject: "front-of-store staff restocking a shelf",
            safe_area: {x: 0.6, y: 0.1, width: 0.34, height: 0.8}, text_color: dark,
            avoid: ["brand logos", "identifiable faces"]}
    expect: [subject_stated, author_avoid, negative_production, no_coordinates]
  - id: P07
    name: 缺主体时如实登记缺口，不编造主体
    given: {function: hero, role: subject, box: [56, 56, 500, 600], subject: "",
            safe_area: {x: 0.0, y: 0.1, width: 0.4, height: 0.8}, text_color: dark}
    expect: [subject_missing_reported, no_fabricated_subject, no_coordinates]
  - id: P08
    name: 极端画幅仍给出可用比例与目标像素
    given: {function: hero, role: subject, box: [100, 40, 300, 640],
            subject: "a single carton on a conveyor"}
    expect: [ratio_usable, target_px_floor, subject_stated, no_coordinates]
