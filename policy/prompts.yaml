# 提示词策略：把「这一页需要什么图」翻译成可交付给摄影师 / 图像模型的说明。
#
# 边界（SKILL.md §5、四层边界）：
#   * 本文件只提供**语言片段**与**顺序**，不含任何判断：要不要图在 judgment，
#     几何在 compose，本层只被 prompt.py 按序拼装；
#   * 不注入风格词（cinematic / luxury / premium / 行业形容词）：风格由作者写在
#     subject / reason 里。自动堆风格词会让十份稿子长成同一张图；
#   * 不写坐标。安全区在提示词里只以「哪一侧安静、什么调子」表达，矩形留给 QC。
#     实测教训（参考 OS 的 v5.6）：写出 `x 6% y 8% w 34% h 78%` 后，图像模型会
#     把留白画成硬边平色面板——被圈住那侧整带标准差 0.4/0.6 灰阶，真实材质留白是 1.7–5.3。
#
# 每条短语都必须是「可拍的物理事实」或「职责」，不是审美形容词。

schema_version: pvad-prompts-v1

# 拼装顺序即契约：测试按此顺序断言。改顺序 = 改所有已出图的可复现性。
clause_order: [role, subject, function, framing, quiet_area, tone, crop_safety, tail, ratio]

phrases:
  role:
    background:
      - "the frame reads as an environment, not a picture of a single thing"
      - "space, material and light carry the frame; no single object competes for attention"
    subject:
      - "one clearly readable subject, treated as an independent visual object"
      - "its scale, position and internal structure stay clear at the size it will be viewed"
    support:
      - "secondary visual material that supports the main subject without competing with it"
      - "readable in one pass, with nothing to decode"
  function:
    hero: "the image carries the page's main visual statement"
    context: "the image establishes context while the foreground stays readable"
    proof: "the examined subject is shown plainly and readable for verification, without dramatization"
    emotion: "the image carries the emotional register of the moment without melodrama"
    frame: "the image frames the message without competing with it"
  quiet_area:
    left: "the left side of the frame stays quiet and continuous with its surroundings for text placed later"
    right: "the right side of the frame stays quiet and continuous with its surroundings for text placed later"
    top: "the upper part of the frame stays quiet and continuous with its surroundings for text placed later"
    bottom: "the lower part of the frame stays quiet and continuous with its surroundings for text placed later"
    center: "the middle of the frame stays calm and continuous with its surroundings for text placed later"
  # 安全区不许被画成「面板」——这是留白句唯一允许的否定指令
  quiet_no_panel: "do not add a separate panel or any flat shape behind that area"
  tone:
    dark: "the quiet area keeps an even tone that will carry dark type"
    light: "the quiet area keeps a tone dark enough to carry light type"
  # 生产尾段：只写「不要出现什么」这一类可被判定的失败，不写「要有多高级」
  tail: [clean composition, no text, no logo, no watermark, no UI elements, no clutter]
  crop_safety: "keep the essential subject inside the frame's central area so a modest crop does not cut it"
  framing: "composed for a {ratio} frame"
  ratio_label: "{ratio} still, no border"

# 反向词只排除**生产失效**与**文案污染**，不排除某种风格或题材：
# 「廉价感」「不高档」这类判断属于作者与评审，不属于可配置策略。
negatives:
  base: [text, letters, numbers, typography, logo, watermark, UI elements, clutter, busy composition]
  production: [AI artifacts, unintended borders or letterboxing, unintended flat painted panels, unintended visible seams, over-sharpening artifacts]
  by_function:
    proof: [dramatization, staged re-enactment, decorative lighting]
  # 作者在 brief.asset.avoid 里写的禁项一律追加，不去重到消失（同义词不算重复）
  join: ", "

# 本层自我审查：这些词一旦出现在**我们自己**的短语表里，就把十份稿子推向同一张图。
# 它管的是策略作者，不是甲方（甲方想写 cinematic 就写在 asset.subject 里）。
style_words_banned: [cinematic, luxury, premium, hyperrealistic, epic, stunning,
                     award-winning, trending on artstation, 8k, masterpiece, moody]

# 画幅：把像素框换算成出图端能直接用的比例。31:39 这种比例没有人会照做，
# 这里吸附到常用画幅；超出容差才如实给原始比例（不假装能整除）。
ratio:
  presets: [[1, 1], [4, 5], [3, 4], [2, 3], [5, 4], [4, 3], [3, 2], [16, 9], [9, 16]]
  tolerance: 0.05

clause_join: "; "

limits:
  max_chars: 900          # 超过说明在堆砌：提示词不是作文
  max_negative_terms: 24  # 反向词过多会互相稀释，超出记一条 issue 而不是静默截断
