# 结构化策略 · 唯一数值来源（Schema：schema/policy.schema.json）
#
# 纪律：
#   1. 任何阈值、枚举、字号、间距、容差只在这里定义一次；Python 模块不得内联常量。
#   2. 这里只回答「多少」；「为什么」归 SKILL.md 判断协议，「形状」归 schema/，「算」归 scripts/。
#   3. 不写行业词表驱动的视觉风格；词表只做证据形状提示，命中不产生风格。

version: 1
id: pvad-strategy-v1

canvas:
  width: 1280
  height: 720
  grid: 8                 # 坐标吸附单位（px）
  columns: 12
  rows: 8
  margin: {left: 72, right: 72, top: 56, bottom: 44}
  gutter: 24
  ppt_dpi: 96             # px → pt 换算：pt = px * 72 / 96

typography:
  # 家族数 ≤ 2（一个中文族承担全部字重，一个拉丁族负责数字与外文）
  families:
    cn: Noto Sans CJK SC
    latin: DejaVu Sans
  # 用于真实测量的字体文件候选（按顺序命中第一个可用的；都没有则退化为估算并置 degraded）
  font_files:
    cn:
      - /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      - /usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc
      - /System/Library/Fonts/PingFang.ttc
      - C:/Windows/Fonts/msyh.ttc
    cn_bold:
      - /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
      - /usr/share/fonts/noto-cjk/NotoSansCJK-Bold.ttc
      - C:/Windows/Fonts/msyhbd.ttc
    latin:
      - /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - /System/Library/Fonts/Helvetica.ttc
      - C:/Windows/Fonts/arial.ttf
  ttc_index: 2            # Noto CJK ttc：SC 为 2（JP0/KR1/SC2/TC3/HK4）
  # 语义字号阶梯（px）；作者不写字号时按语义选择，不按「看起来差不多」选
  scale:
    display: 88
    h1: 60
    h2: 42
    lede: 30
    body: 22
    label: 18
    micro: 15
    source: 13
  floors:                 # 最小字号（px）——低于此值 BLOCK：该删内容，不是缩字号
    display: 48
    h1: 34
    h2: 26
    lede: 20
    body: 16
    label: 14
    micro: 12
    source: 11
  line_height:
    display: 1.06
    h1: 1.12
    h2: 1.24
    lede: 1.44
    body: 1.62
    label: 1.4
    micro: 1.42
    source: 1.3
  tracking_pt:            # 字距（pt）：中文大字收、小字放
    display: -1.4
    h1: -0.9
    h2: -0.3
    lede: 0.0
    body: 0.2
    label: 0.8
    micro: 0.8
    source: 0.2
  max_lines:              # 各语义档允许的行数上限
    display: 3
    h1: 3
    h2: 3
    lede: 4
    body: 7
    label: 1
    micro: 2
    source: 2
  ink_height_floor: 1.2   # 无字体度量时末行字形高 = size × max(line_height, 本值)
  orphan:
    min_last_line_chars: 2      # 末行 ≤1 字即孤字
    forbidden_line_start: ["，", "。", "、", "；", "：", "？", "！", "）", "」", "』", "】", "》", "%", "％", "‰"]
    forbidden_line_end: ["（", "「", "『", "【", "《"]
  # 强调档（judgment 给高潮页 emphasis=lead）→ 主张字号档上移几级。
  # 判断只有落到可测量的排版差异上才算进流程；这里就是那个落点。
  emphasis_ladder_boost:
    lead: 1
    normal: 0
  line_break:
    # 允许在这些字符之后断行（标点级断点）；禁则字符另见 typography.orphan.*
    after_punct: "，。、；：！？）》」』】,.;:!?)]}"
    min_line_fill: 0.55        # 断行前一行至少要排到可用宽度的这个比例（否则宁可多挤一个词）
  number_unit:
    bind: true                  # 数字与单位之间不换行（写入 U+00A0）
    unit_patterns: ["%", "％", "‰", "亿元", "万元", "元", "亿美元", "万美元", "美元", "公里", "千米", "米", "公斤", "千克", "吨", "平方米", "立方米", "小时", "分钟", "秒", "天", "周", "个月", "年", "倍", "个百分点", "台", "人", "户", "家", "件", "次"]

colors:
  tokens: [background, surface, ink, muted, primary, accent, negative, hairline]
  defaults:
    background: "#F7F5F1"
    surface: "#FFFFFF"
    ink: "#14161A"
    muted: "#6B7076"
    primary: "#1F4E5A"
    accent: "#B4522A"
    negative: "#8C2F1F"
    hairline: "#D8D3CB"
  # 有语义的强调色上限：超过即「处处强调 = 没有强调」
  accent_budget_per_page: 2
  contrast:
    body_min: 4.5
    large_min: 3.0
    large_size_px: 32
  pairing:            # 深浅配色对（背景 token → 可用前景 token）
    # 键是「页面底色是浅还是深」，值是在这种底色上允许出现的前景色 token。
    # 深底不能只留 surface/hairline：深底稿件的 ink 本身就是浅色（例如案例 B 的 #F2ECE3），
    # 只用 surface/hairline 会让整页正常文字全部报 TOKEN_PAIRING——那是策略没覆盖深底，
    # 不是稿件越界。真实可读性由 colors.contrast 的实测对比度单独判，不靠这张表。
    light_background: [ink, muted, primary, accent, negative]
    dark_background: [ink, muted, primary, accent, negative, surface, hairline]

enums:
  role: [establish, explain, compare, prove, persuade, summarize]
  evidence: [comparison, series, part_whole, number, structure, sequence, proposition, none]
  claim_source: [author, derived, absent]
  composition: [statement, metric_row, two_end, series_chart, part_whole, sequence_steps, structure_map, editorial_text, image_narrative, image_narrative_left]
  density: [sparse, balanced, dense]
  rhythm_move: [open, build, turn, hold, breathe, close]
  emphasis: [lead, normal, quiet]
  focus_role: [claim, metric, chart, subject, step, decision]
  element_type: [text, shape, image, chart]
  # 配方槽位类型：primitive（写入 deck 的元素）或 composite（compose 展开成多个 primitive）
  slot_type: [text, shape, image, chart, kpi, steps, groups]
  chart_kind: [column, bar, line, donut, progress]
  media_decision: [none, required, existing]     # 本页要不要图；required=作者声明要出图，existing=复用既有素材
  media_role: [background, subject, support]     # 背景氛围 / 承载核心视觉 / 补充语义
  media_function: [hero, context, proof, emotion, frame]
  focus: [claim, metric, chart, subject, step, decision]   # 与 plan.schema.json 的同名枚举一致（有测试守）

thresholds:
  snap: 8                     # 坐标吸附精度（px）
  position_drift_px: 1.5      # PPTX 回读与 spec 的几何容差
  size_drift_px: 1.5
  ink_overlap_px: 1.0         # 墨迹相交判据（px）
  frame_overlap_ratio: 0.98   # 容器包含关系：子框面积 ≥ 父框此比例视为包裹，不算冲突
  safe_area_ratio: 0.92       # 内容须落在画布安全区内
  numeric_density_high: 3.2   # 每 100 字的数字出现次数
  numeric_density_low: 0.8
  line_width_ratio: 0.86      # 文本可用宽度 = 框宽 × 该值（预留右侧呼吸）
  min_gap_px: 16              # 任意两元素之间最小呼吸间距
  fidelity_pixel_mismatch_max: 0.004   # spec 渲染 vs PPTX 回读渲染的像素差上限
  size_pt_tolerance: 0.75              # 回读字号容差（pt）：半磅/EMU 取整的物理下限
  chart_scale_skew_ratio: 100          # 同一张图里最大/最小序列均值之比：超过说明混了两套量纲
  max_steps: 6                 # 横向工序/阶段最多几列；超过不静默丢弃，由 guard 报告
  chart_max_categories: 12
  chart_value_label_max: 8
  words_per_second: 6.0       # 讲稿时长估算（presentation budget）

judgment:
  # 判断不出视觉世界时的兜底文案。设计语言不写在 Python 里，改口径只改这里。
  default_world:
    value: "中性纸面：单一底色 + 墨色文字 + 一个语义强调色；材质与光影不参与叙事"
    why: "作者未声明 visual_world / brand：按判断协议保持中性，比套用行业风格更诚实"
  # 证据词表只用于「提示」，命中不产生风格、不直接决定 composition。
  # 每个词表都必须在 tests/test_judgment.py 里有一个会因删除而失败的用例（ablate 自检）。
  lexicons:
    comparison_end: ["相比", "对比", "高于", "低于", "vs", "VS", "前者", "后者", "高出", "低了", "超过", "不到",
                     "同比", "环比", "较", "倍"]
    comparison_negated: ["未超过", "没有超过", "不高于", "不低于", "不得超", "没有低于"]
    # 两端页的中心表达必须跟随作者主张：写“倍”就显示比值，不能擅自改成绝对差。
    comparison_ratio: ["倍", "倍于"]
    series: ["逐年", "逐月", "逐季", "逐周", "趋势", "走势", "CAGR", "年复合", "连续三个季度", "连续三年"]
    part_whole: ["占比", "占", "其中", "其余", "构成", "结构占比", "份额"]
    denominator_risk: ["相加", "合计", "加总", "总和为", "共 100", "100%"]
    sequence: ["第一步", "第二步", "步骤", "阶段", "流程", "先", "然后", "接着", "最后", "迭代", "路线图", "roadmap"]
    sequence_strong: ["步骤", "流程", "阶段", "路线图", "roadmap", "第一步", "第二步", "第三步"]
    structure: ["体系", "架构", "框架", "模块", "层级", "分为", "包括", "由……组成", "汇报", "归属", "下设"]
    # 措辞线索：只影响「这是不是一句论断 / 什么语气」的判断，不产生风格。
    # 每条都必须在 evals/cases.yaml 里有一条「删掉就会失败」的用例，否则视为死配置。
    claim_cue: ["因此", "所以", "结论", "意味着", "必须", "唯一", "关键", "本质", "只有", "决定", "应当", "建议"]
    assertion_cue: ["不", "没", "无", "须", "应", "要", "能", "会", "可以", "已经", "将", "达", "是", "为", "有", "让", "把"]
    change_cue: ["增至", "降至", "提升", "下降", "增长", "减少", "高出", "低于", "高于", "超过", "达到", "翻倍",
                 "腰斩", "抬升", "走高", "回落", "收窄", "扩大", "翻番", "失速", "承压", "逐季", "逐年", "转投", "转向"]
    visual_subject: ["门店", "车间", "产线", "仓库", "现场", "设备", "门店陈列", "产品", "样机", "材料", "材质",
                     "建筑", "空间", "光线", "人物", "工人", "客户", "顾客", "手工", "工艺", "包装", "实物"]
    imperative_cue: ["请批准", "请决定", "请审议", "请确认", "批准", "表决", "签字", "决定", "须", "应当", "建议"]
    ask: ["请批准", "请决定", "请审议", "请确认", "批准", "表决", "签字", "决定"]
    causal_risk: ["因此", "导致", "带来", "使得", "从而", "因为", "所以"]
    correlation_cue: ["相关", "同时", "伴随", "一起上升", "同步"]
    conditional: ["如果", "若", "一旦", "拟", "计划", "预计"]
  # 词表命中 → 待确认问题（写进 plan.open_questions），不自动改内容
  probes:
    part_whole: "这些分项是否互斥且共用同一分母？相加为 100% 不证明它们构成同一个整体。"
    causal_risk: "文中的「因此／导致」是作者的因果断言还是并列陈述？没有机制证据时不补箭头。"
    correlation_cue: "同时发生不等于因果，是否把并列表述画成了因果链？"
    conditional: "这是已发生事实、条件假设，还是未来计划？三者不能共用一个视觉形态。"
    comparison_end: "被比较的另一端是否真实存在于同一口径、同一期间？"
    structure: "这些对象之间是并列、从属还是时间顺序？只有明确给出才补层级或箭头。"
    visual_subject: "这一页讲的是可被看见的实物/现场吗？若理解确实依赖「看见」，请声明素材；词表只提示，技能包不自动出图。"

assets:
  formats: [".png", ".jpg", ".jpeg", ".webp"]
  # 单张图解码预算：超过就要求先降采样再登记（1GB 内存下的硬边界，不是审美）
  pixels:
    max_decode: 60000000
  # 分辨率下限：放置尺寸 × oversample 与 min_long_side 取大者，低于即 BLOCK（放大必糊）
  min_long_side_px: 640
  oversample: 2.0
  max_per_page: 2
  # 裁切：cover 会裁掉内容，裁掉比例超过该倍数时必须写 reason
  crop_allow: [cover]
  crop_requires_reason_above: 1.35
  # 文字压图：必须有声明过的安全区，且实测亮度差达标
  text_over_image:
    require_safe_area: true
    min_luma_delta: 0.18
    min_contrast_ratio: 3.0
    sample_max_side: 384
  safe_area:
    default_anchor: left
    min_width_ratio: 0.26
  # 装饰性素材（frame/emotion）必须写出它替观众理解了什么
  decorative_requires_reason: true
  # 同一素材跨页复用是允许的，但职能必须一致
  reuse_requires_same_function: true
  qc:
    flat_std: 0.02          # 低于此标准差视为平坦区（可用作留白）
    busy_std: 0.12          # 高于此标准差视为纹理过密（压字会读不清）
    min_negative_ratio: 0.15

render:
  ghost_supersample: 2
  ghost_max_pages: 8
  contact_sheet_columns: 2
  contact_sheet_thumb_width: 480  # 仅联系表缩略图；单页证据保留原始渲染，避免长稿联系表占用过高内存
  diff_grid: 4                # 像素差比较下采样网格（px）

security:
  # OOXML/PPTX 资源安全预算，只防止解压炸弹和异常规模输入，不评价设计质量。
  pptx:
    max_file_bytes: 250000000
    max_zip_entries: 20000
    max_uncompressed_bytes: 1000000000
    max_entry_bytes: 250000000
    max_compression_ratio: 200
    max_slides: 500
    max_objects_per_slide: 5000
    max_embedded_image_pixels: 100000000

verification:
  modes: [spec, draft, release]
  # 哪些失败码会真的 BLOCK。放在策略里：加一个码是不是阻断项，是产品决定，不是代码细节
  # 哪些失败码会真的 BLOCK：必须与 guard 实际抛出的错误码一一对应（有测试守）。
  # 漏一个 = 该错误不拦；多一个 = 死配置。加码时同步这里。
  blocking_codes:
    - ACCENT_OVER_BUDGET
    - EVIDENCE_NOT_LAID_OUT
    - ASSET_BUDGET
    - ASSET_CONTRAST
    - ASSET_CROP
    - ASSET_DECLARATION
    - ASSET_FORMAT
    - ASSET_MISSING
    - ASSET_RESOLUTION
    - ASSET_SAFE_AREA
    - CHART_INVALID
    - CHART_MIXED_UNITS
    - ELEMENT_ID_DUPLICATE
    - ELEMENT_OVERLAP
    - EMPTY_DECK
    - EMPTY_SLIDE
    - FIELD_UNKNOWN
    - FONT_FAMILIES
    - GEOMETRY_INVALID
    - OUT_OF_CANVAS
    - PROVENANCE_MISSING
    - SCHEMA_FAIL
    - SOURCE_ZONE_COLLISION
    - TEXT_OVERFLOW
    - TEXT_SIZE_FLOOR
    - TEXT_TOO_WIDE
    - TOKEN_UNKNOWN
    - UNIT_INCONSISTENT

  default_mode: draft
  release_requires: [source, unit, period, basis]
  # BUILD 前的语义闸门：这些未决项会改变事实、主张、素材证据或页面存在价值，不能静默落版。
  build_blocking_open_questions:
    - CLAIM_ABSENT
    - PROVENANCE_MISSING
    - ASSET_REASON_MISSING
    - ASSET_PROOF_UNSOURCED
    - ASSET_VS_EVIDENCE
    - EMPTY_PAGE
  exit_codes: {ok: 0, blocked: 1, usage: 2}
